<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samuel Turner Project Portfolio</title>
  <meta name="description" content="Engineering projects by Samuel Turner." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <!-- Hero -->
    <header class="hero">
      <h1 class="title">
        <span class="mask"><span class="rise">Samuel Turner <em>Project Portfolio</em></span></span>
      </h1>
      <div class="hero-foot fade">
        <p>A collection of engineering projects I've designed and built.</p>      </div>
    </header>

    <!-- Project index -->
    <section class="work" id="work">
      <div class="work-head">
        <h2>Projects <sup id="count"></sup></h2>
      </div>
      <ol class="index" id="list"></ol>
      <p class="empty" id="empty" hidden>Projects coming soon.</p>
    </section>
  </main>

  <footer class="footer">
    <span>&copy; <span id="year"></span> Samuel Turner</span>
    <a href="#top" id="toTop">Back to top &uarr;</a>
  </footer>

  <!-- Project page -->
  <div class="project" id="project" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="project-bar">
      <span id="pIndex"></span>
      <button class="close" id="pClose">Close <span aria-hidden="true">&#10005;</span></button>
    </div>
    <article class="project-inner">
      <header class="p-head">
        <p class="p-meta" id="pMeta"></p>
        <h2 id="pTitle"></h2>
        <p class="p-summary" id="pSummary"></p>
      </header>
      <figure class="p-cover" id="pCover"></figure>
      <div class="p-body">
        <aside class="p-facts" id="pFacts"></aside>
        <div class="p-desc" id="pDesc"></div>
      </div>
      <div class="p-gallery" id="pGallery"></div>
      <button class="p-next" id="pNext">
        <span>Next project</span>
        <strong id="pNextTitle"></strong>
      </button>
    </article>
  </div>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
